<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101413"><title>回响 PALINODE · 记忆观测台</title><link rel="stylesheet" href="style.css?v=mobile-layout-1"><link rel="stylesheet" href="observatory.css"></head>
<body>
  <header class="topbar">
    <a class="wordmark" href="./" aria-label="回响首页"><span class="brand-symbol">◎</span> 回响<span class="brand-en">PALINODE</span></a>
    <span class="site-description">五月天 · 私人记忆现场</span>
    <div class="header-actions">
      <button id="toggle-sidebar" aria-expanded="false" aria-controls="memory-panel">调整</button>
      <div id="creation"><input id="photo-input" type="file" accept="image/jpeg,image/png,image/webp" hidden><button id="choose-photo" class="primary"><span>＋</span> 新建记忆</button></div>
    </div>
  </header>
  <div class="workspace">
    <section id="memory-panel" aria-label="记忆收藏">
      <div class="sidebar-top"><p class="eyebrow">MAYDAY / FAN MEMORY</p><h1>我们的现场</h1><p class="intro" id="intro">把那一天，留在这一站。</p></div>
      <section class="ticket-editor" aria-label="纪念票根"><div class="section-title">这一站的票根</div><label for="ticket-city">城市 / 场馆</label><input id="ticket-city" maxlength="16" placeholder="某座城市"><label for="ticket-date">纪念日期</label><input id="ticket-date" type="date"><div class="member-key"><span style="--member:#d8b800">玛莎</span><span style="--member:#ee5418">怪兽</span><span style="--member:#cc599a">阿信</span><span style="--member:#209fcd">冠佑</span><span style="--member:#13975f">石头</span></div></section>
      <div id="library-section" hidden><label for="library">我的收藏 <span id="memory-count"></span></label><select id="library" aria-label="选择已保存的记忆"></select></div>
      <div id="current-memory" hidden>
        <div class="memory-summary"><img id="photo-preview" alt="记忆原照片"><div><h2 id="memory-name"></h2><p id="memory-date"></p></div></div>
        <p id="job-message" role="status" aria-live="polite"></p>
        <ol id="steps" aria-label="制作步骤" hidden><li>照片</li><li>重建</li><li>装盒</li><li>收藏</li></ol>
        <button id="retry" hidden>重新制作 ↗</button>
        <div id="memory-actions" hidden>
          <button id="download-memory" class="primary">收藏到本机 <span>↓</span></button>
          <div class="actions"><button id="save-settings">保存设置</button><button id="snapshot">导出画面 ↗</button></div><div class="actions"><button id="replay-creation">重播收藏过程 ↗</button></div>
        </div>
      </div>
      <section class="composition" aria-label="内容构图">
        <div class="section-title">空间构图 <span>01</span></div>
        <div class="fit-options"><button id="fit-cover" aria-pressed="true">充满</button><button id="fit-contain" aria-pressed="false">完整</button></div>
        <label for="content-scale">内容大小 <output id="content-scaleValue">65%</output></label><input id="content-scale" type="range" min="0.65" max="1.75" step="0.01" value="0.65">
        <label for="depth-volume">空间层次 <output id="depth-volumeValue">100%</output></label><input id="depth-volume" type="range" min="0.35" max="1" step="0.01" value="1">
      </section>
      <aside id="panel" aria-label="光学调节"><details><summary>光学调节 <span>＋</span></summary><div class="material-controls">
        <label for="glow">柔光 <output id="glowValue">0.12</output></label><input id="glow" type="range" min="0" max="2" step="0.01" value="0.12">
        <label for="frost">玻璃雾度 <output id="frostValue">0.03</output></label><input id="frost" type="range" min="0" max="1" step="0.005" value="0.025">
        <label for="brightness">内容亮度 <output id="brightnessValue">1.05</output></label><input id="brightness" type="range" min="0.4" max="3" step="0.01" value="1.05">
        <button id="motion" class="quiet" aria-pressed="true">暂停流光</button>
      </div></details></aside>
      <p id="connection">正在连接本机记忆库…</p><p class="format-note">JPG / PNG / WebP · 最大 25 MB</p>
      <p id="notice" role="alert" hidden></p>
      <footer class="archive-credit"><span class="status-dot"></span> LOCAL FIRST <a href="./ABOUT.md" target="_blank">来源与许可</a></footer>
    </section>
    <section class="object-view" aria-label="记忆展示">
      <div class="object-caption"><span><i class="status-dot"></i> OPTICAL ARCHIVE</span><span id="scene-state">待存入 / STANDBY</span></div>
      <div class="scene-heading"><span>MAYDAY / 私人纪念</span><h2>五个人。我们的现场。</h2><p>ONE DAY · FIVE COLORS · YOUR MEMORY</p></div>
      <main id="stage" aria-label="可旋转和缩放的三维记忆观测舱"></main>
    </section>
  </div>
  <div class="mobile-backdrop" id="close-sidebar" hidden></div>
  <script type="module" src="browser-inference/ui.js?v=mobile-advice-2"></script>
<script type="module" src="film.js?v=mobile-memory-1"></script><script type="module" src="observatory-ui.js"></script></body></html>
